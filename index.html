<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#00ff41">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Retro-styled IPTV streaming terminal - Watch free live TV channels">
    <title>HOME TV</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- App Icons -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png" type="image/png">

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Local Assets -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">
        <span class="material-icons-round">menu</span>
    </button>

    <!-- Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
        <!-- Simplified Sidebar Header -->
        <div class="sidebar-header">
            <div class="sidebar-title">
                <button class="collapse-btn" id="collapseBtn" title="Collapse">
                    <span class="material-icons-round">keyboard_double_arrow_left</span>
                </button>
                <span class="system-label"><span class="material-icons-round">tv</span></span>
            </div>
        </div>

        <!-- Collapsible Config -->
        <div class="system-info" onclick="toggleConfig()">
            <span class="config-label">CONFIG</span>
            <span class="toggle-icon" id="configToggle">+</span>
        </div>

        <div id="configPanel" class="config-panel collapsed">
            <div class="source-section">
                <div class="cmd-line">
                    <span class="prompt">URL:</span>
                    <input type="text" class="cmd-input" id="sourceInput" placeholder="https://..." tabindex="1">
                    <button class="btn-exec" id="loadBtn" tabindex="2">GO</button>
                </div>

                <div class="cmd-line" style="margin-top: 8px;">
                    <span class="prompt">PRESET:</span>
                    <select class="terminal-select" id="playlistSelect" tabindex="3" style="flex: 1;">
                        <option value="https://iptv-org.github.io/iptv/index.m3u" selected>WORLDWIDE</option>
                        <option value="manual">CUSTOM URL</option>
                        <optgroup label="SAVED LISTS" id="savedListsGroup">
                            <!-- Populated dynamically from fav/ folder -->
                        </optgroup>
                        <optgroup label="CATEGORIES">
                            <option value="https://iptv-org.github.io/iptv/categories/news.m3u">NEWS</option>
                            <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">MOVIES</option>
                            <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">SPORTS</option>
                            <option value="https://iptv-org.github.io/iptv/categories/music.m3u">MUSIC</option>
                            <option value="https://iptv-org.github.io/iptv/categories/entertainment.m3u">ENTERTAINMENT
                            </option>
                            <option value="https://iptv-org.github.io/iptv/categories/kids.m3u">KIDS</option>
                        </optgroup>
                        <optgroup label="REGIONS">
                            <option value="https://iptv-org.github.io/iptv/countries/us.m3u">USA</option>
                            <option value="https://iptv-org.github.io/iptv/countries/ca.m3u">CANADA</option>
                            <option value="https://iptv-org.github.io/iptv/countries/uk.m3u">UK</option>
                            <option value="https://iptv-org.github.io/iptv/regions/eur.m3u">EUROPE</option>
                            <option value="https://iptv-org.github.io/iptv/regions/asia.m3u">ASIA</option>
                        </optgroup>
                    </select>
                </div>

                <div class="cmd-line" style="margin-top: 8px;">
                    <span class="prompt">GENRE:</span>
                    <select class="terminal-select" id="categorySelect" tabindex="4" style="flex: 1;">
                        <option value="">ALL</option>
                    </select>
                </div>

                <div class="cmd-line" style="margin-top: 8px;">
                    <span class="prompt">SORT:</span>
                    <select class="terminal-select" id="sortSelect" tabindex="5" style="flex: 1;">
                        <option value="none">DEFAULT</option>
                        <option value="alpha">A-Z</option>
                        <option value="fav">FAVORITES</option>
                    </select>
                </div>

                <div class="cmd-line" style="margin-top: 12px; gap: 8px;">
                    <span class="prompt">DATA:</span>
                    <button class="btn-exec" onclick="window.exportData()" style="flex: 1;">EXPORT</button>
                    <button class="btn-exec" onclick="window.importData()" style="flex: 1;">IMPORT</button>
                    <input type="file" id="importFileInput" accept=".json" style="display: none;">
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="nav-primary">
            <button class="tab active" id="tab-all" onclick="setListTab('all', this)">ALL</button>
            <button class="tab" id="tab-fav" onclick="setListTab('favorites', this)">FAV</button>
            <button class="tab" id="tab-recent" onclick="setListTab('recents', this)">RECENT</button>
        </div>

        <!-- Search -->
        <div class="search-section">
            <input type="text" class="cmd-input" id="searchInput" placeholder="Search channels..." tabindex="5">
        </div>

        <div class="channel-list" id="channelList"></div>


        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">READY</span>
            </div>
            <div class="status-item" style="margin-left:auto;">
                <span id="channelCount">0</span>
            </div>
        </div>
    </aside>

    <div class="tv-container">
        <div class="tv-case">
            <div class="tv-screen-bezel">
                <div class="static-noise"></div>
                <main class="main-display">


                    <div class="terminal-overlay" id="overlay">
                        <div class="boot-text" id="bootText" style="display:none">
                            <div class="line">HOME TV v3.1</div>
                            <div class="line" style="animation-delay: 0.3s">> SELECT A CHANNEL_</div>
                        </div>
                    </div>

                    <!-- Sleek Unified Control Dock -->
                    <div id="runModeOverlay" class="run-mode-overlay remote-dock">
                        <div class="remote-body">
                            <!-- 1. Logo & Channel Name -->
                            <div class="channel-display-group">
                                <div class="channel-icon-glass" id="channelIconWrapper">
                                    <img src="" id="channelIcon" class="remote-channel-icon"
                                        onerror="this.style.display='none'">
                                </div>
                                <div class="remote-title" id="displayTitle">NO<br>SIGNAL</div>
                                <div class="remote-info" id="displayInfo"></div>
                            </div>

                            <!-- 2. Time -->
                            <div class="remote-time-display" id="liveTime"></div>

                            <!-- Live Status -->
                            <div class="live-status-marker" id="liveIndicator">
                                <div class="live-dot"></div>
                            </div>

                            <!-- Infinity / Timer -->
                            <div class="timer-wrapper header-timer" id="runTimerContainer">
                                <button class="remote-btn accent small" id="runTimeBtn">
                                    <span class="material-icons-round">all_inclusive</span>
                                </button>
                                <!-- Inline Expand -->
                                <div class="timer-expand-inline" id="timerExpand">
                                    <button class="mini-btn" id="add1mBtn">+1</button>
                                    <button class="mini-btn" id="add5mBtn">+5</button>
                                    <button class="mini-btn danger" id="stopLoopBtn">✕</button>
                                </div>
                            </div>

                            <div class="remote-divider"></div>

                            <!-- Navigation Stack -->
                            <div class="nav-stack">
                                <button class="remote-btn small" id="runPrevBtn">
                                    <span class="material-icons-round">keyboard_arrow_left</span>
                                </button>
                                <button class="remote-btn primary" id="hw-play-btn">
                                    <span class="material-icons-round">play_arrow</span>
                                </button>
                                <button class="remote-btn small" id="runNextBtn">
                                    <span class="material-icons-round">keyboard_arrow_right</span>
                                </button>
                            </div>

                            <div class="remote-divider"></div>

                            <!-- Tools Vertical Stack -->
                            <div class="tools-stack">
                                <!-- Favorite -->
                                <button class="remote-btn small" id="runFavBtn">
                                    <span class="material-icons-round">star_border</span>
                                </button>

                                <!-- Volume Slider (Segmented) -->
                                <div class="vol-slider-container" id="volSegmentedSlider">
                                    <!-- Segmented bar -->
                                    <div class="vol-segmented-track">
                                        <div class="vol-segmented-fill" id="volLevelFill"></div>
                                        <!-- Overlay for segment lines -->
                                        <div class="vol-segment-overlay"></div>
                                    </div>

                                    <!-- Mute Button at bottom -->
                                    <button class="vol-mute-btn" id="hw-mute-btn">
                                        <span class="material-icons-round">volume_up</span>
                                    </button>
                                </div>

                                <div class="remote-divider"></div>

                                <!-- PiP -->
                                <button class="remote-btn small" id="hw-pip-btn">
                                    <span class="material-icons-round">picture_in_picture_alt</span>
                                </button>

                                <!-- Fullscreen -->
                                <button class="remote-btn small" id="hw-fs-btn">
                                    <span class="material-icons-round">fullscreen</span>
                                </button>

                            </div>

                            <!-- Timer Progress -->
                            <div class="dock-progress-bar">
                                <div class="dock-progress-fill" id="runTimerFill"></div>
                            </div>

                        </div>
                    </div>

                    <div class="player-container">
                        <video id="video" playsinline></video>
                    </div>
                </main>
            </div><!-- /tv-screen-bezel -->
        </div><!-- /tv-case -->
    </div><!-- /tv-container -->

    <!-- Saved Lists Data -->
    <script src="saved-lists.js"></script>

    <!-- Database Module -->
    <script src="db.js"></script>

    <!-- Main Application Script -->
    <script src="script.js"></script>
</body>

</html>
